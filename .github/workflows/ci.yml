name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mallens
          POSTGRES_PASSWORD: mallens_pass
          POSTGRES_DB: mallens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mallens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          pip install flake8
          flake8 app --max-line-length=110 --extend-ignore=E203,W503 || true

      - name: Run unit + integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://mallens:mallens_pass@localhost:5432/mallens_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
          REQUIRE_AUTH: "false"
        run: pytest -v

      - name: Dependency vulnerability scan
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t mallens-api:ci ./backend
      - name: Build frontend image
        run: docker build -t mallens-frontend:ci ./frontend
